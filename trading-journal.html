<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Jurnali</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--panel2:#12141a;--line:#2a2f3a;--text:#e6e8ee;--muted:#8a90a0;
--green:#22c55e;--red:#ef4444;--gray:#64748b;--orange:#f59e0b;--blue:#3b82f6;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}
.btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--red)}
.btn.small{padding:4px 10px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:20px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.card .value{font-size:22px;font-weight:600;margin-top:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:0 24px 12px;align-items:center}
input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px;font-family:inherit}
.search{flex:1;min-width:200px}
.table-wrap{overflow-x:auto;margin:0 24px 40px;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1150px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--panel2);color:var(--muted);font-weight:500;position:sticky;top:0}
tbody tr:hover td{background:#1c2029}
.badge{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.long{background:var(--green)}.short{background:var(--red)}
.tp{background:var(--green)}.loss{background:var(--red)}.be{background:var(--gray)}
.tag{background:#2a2f3a;border-radius:6px;padding:3px 8px;font-size:12px;color:#cbd5e1}
.arg-SMC{background:#f59e0b33;color:#fbbf24}
.arg-OB{background:#f9731633;color:#fb923c}
.arg-OF{background:#ef444433;color:#f87171}
.arg-D{background:#f5c94233;color:#fde047}
.pos{color:var(--green);font-weight:600}.neg{color:var(--red);font-weight:600}
a{color:var(--blue);text-decoration:none}
.form-wrap{display:none;margin:0 24px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.form-wrap.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.empty{text-align:center;color:var(--muted);padding:30px}
.muted{color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>📈 Trading Jurnali</h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn ghost" onclick="exportJSON()">Eksport</button>
    <label class="btn ghost" style="cursor:pointer">Import
      <input type="file" accept=".json" onchange="importJSON(event)" hidden>
    </label>
    <button class="btn" onclick="openForm()">+ Yangi savdo</button>
  </div>
</header>

<section class="stats">
  <div class="card"><div class="label">Jami savdo</div><div class="value" id="sTotal">0</div></div>
  <div class="card"><div class="label">Win rate</div><div class="value" id="sWin">0%</div></div>
  <div class="card"><div class="label">Umumiy foyda</div><div class="value" id="sProfit">$0</div></div>
  <div class="card"><div class="label">O'rtacha R/R</div><div class="value" id="sRR">0</div></div>
  <div class="card"><div class="label">TP / Loss / BU</div><div class="value" id="sBreakdown">0 / 0 / 0</div></div>
</section>

<div class="form-wrap" id="formWrap">
  <form id="tradeForm" onsubmit="saveTrade(event)">
    <div class="grid">
      <label>Sana <input type="date" name="date" required></label>
      <label>Juftlik <input type="text" name="pair" placeholder="BTCUSDT" required></label>
      <label>Pozitsiya
        <select name="position"><option>Long</option><option>Short</option></select>
      </label>
      <label>Kirish (link) <input type="url" name="before" placeholder="https://..."></label>
      <label>Chiqish (link) <input type="url" name="after" placeholder="https://..."></label>
      <label>Argument
        <select name="argument">
          <option>SMC</option><option>Order block</option><option>Order flow</option><option>Discount</option><option>Boshqa</option>
        </select>
      </label>
      <label>Risk % <input type="number" step="0.1" name="risk" value="1"></label>
      <label>R/R <input type="number" step="0.1" name="rr" value="1.3"></label>
      <label>Foyda ($) <input type="number" step="0.01" name="profit" value="0"></label>
      <label>Natija
        <select name="result"><option>Take Profit</option><option>Loss</option><option>BU</option></select>
      </label>
      <label>Izoh <input type="text" name="comment" placeholder="Izoh..."></label>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost" onclick="closeForm()">Bekor qilish</button>
      <button type="submit" class="btn" id="saveBtn">Saqlash</button>
    </div>
  </form>
</div>

<div class="toolbar">
  <input class="search" id="search" placeholder="Juftlik yoki izoh bo'yicha qidirish..." oninput="render()">
  <select id="fResult" onchange="render()">
    <option value="">Barcha natija</option>
    <option>Take Profit</option><option>Loss</option><option>BU</option>
  </select>
  <select id="fPos" onchange="render()">
    <option value="">Barcha pozitsiya</option>
    <option>Long</option><option>Short</option>
  </select>
  <select id="fArg" onchange="render()">
    <option value="">Barcha argument</option>
    <option>SMC</option><option>Order block</option><option>Order flow</option><option>Discount</option><option>Boshqa</option>
  </select>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Sana</th><th>Juftlik</th><th>Pozitsiya</th><th>Kirish</th><th>Chiqish</th>
        <th>Argument</th><th>Risk %</th><th>R/R</th><th>Foyda</th><th>Natija</th><th>Izoh</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">Savdolar yo'q. "+ Yangi savdo" tugmasini bosing.</div>
</div>

<script>
const KEY = 'trading-journal-v1';
const SAMPLE = [
  {id:1,date:'2025-08-26',pair:'STCUSDT',position:'Long',before:'',after:'',argument:'SMC',risk:1,rr:1.3,profit:-10,result:'Loss',comment:''},
  {id:2,date:'2025-08-29',pair:'GRAMUSDT',position:'Long',before:'',after:'',argument:'Order block',risk:1,rr:1.3,profit:30,result:'Take Profit',comment:'narmal'},
  {id:3,date:'2025-09-01',pair:'SOLANAUSDT',position:'Long',before:'',after:'',argument:'SMC',risk:1,rr:1.3,profit:-10,result:'Loss',comment:'hissiyot'},
  {id:4,date:'2025-09-08',pair:'BTC USDT',position:'Long',before:'',after:'',argument:'Order block',risk:1,rr:1.3,profit:0,result:'BU',comment:'hissiyot'},
  {id:5,date:'2025-09-18',pair:'HYPE USDT',position:'Long',before:'',after:'',argument:'Order flow',risk:1,rr:1.3,profit:10,result:'Loss',comment:'kayfiyat'},
  {id:6,date:'2025-09-24',pair:'SOLANA USDT',position:'Long',before:'',after:'',argument:'SMC',risk:1,rr:1.3,profit:34,result:'Take Profit',comment:'hissiyot'}
];

let trades = load();
let editId = null;

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(d)) return d;
  }catch(e){}
  return SAMPLE.map(t => ({...t}));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(trades)); }catch(e){}
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n){
  const v = Number(n) || 0;
  return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
}
function resultClass(r){ return r === 'Take Profit' ? 'tp' : r === 'Loss' ? 'loss' : 'be'; }
function argClass(a){
  if(a === 'SMC') return 'arg-SMC';
  if(a === 'Order block') return 'arg-OB';
  if(a === 'Order flow') return 'arg-OF';
  if(a === 'Discount') return 'arg-D';
  return 'tag';
}
function link(url){
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">📄 Ochish</a>` : '<span class="muted">—</span>';
}

function filtered(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const fr = document.getElementById('fResult').value;
  const fp = document.getElementById('fPos').value;
  const fa = document.getElementById('fArg').value;
  return trades
    .filter(t => !q || (t.pair + ' ' + (t.comment||'')).toLowerCase().includes(q))
    .filter(t => !fr || t.result === fr)
    .filter(t => !fp || t.position === fp)
    .filter(t => !fa || t.argument === fa)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));
}

function renderStats(){
  const n = trades.length;
  const tp = trades.filter(t => t.result === 'Take Profit').length;
  const loss = trades.filter(t => t.result === 'Loss').length;
  const bu = trades.filter(t => t.result === 'BU').length;
  const total = trades.reduce((s,t) => s + (Number(t.profit)||0), 0);
  const rr = n ? trades.reduce((s,t) => s + (Number(t.rr)||0), 0) / n : 0;
  const decided = tp + loss;
  const win = decided ? Math.round(tp / decided * 100) : 0;

  document.getElementById('sTotal').textContent = n;
  document.getElementById('sWin').textContent = win + '%';
  const pEl = document.getElementById('sProfit');
  pEl.textContent = money(total);
  pEl.className = 'value ' + (total >= 0 ? 'pos' : 'neg');
  document.getElementById('sRR').textContent = rr.toFixed(2);
  document.getElementById('sBreakdown').textContent = `${tp} / ${loss} / ${bu}`;
}

function render(){
  renderStats();
  const rows = filtered();
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('tbody').innerHTML = rows.map(t => `
    <tr>
      <td>${esc(t.date)}</td>
      <td><strong>${esc(t.pair)}</strong></td>
      <td><span class="badge ${t.position === 'Long' ? 'long' : 'short'}">${esc(t.position)}</span></td>
      <td>${link(t.before)}</td>
      <td>${link(t.after)}</td>
      <td><span class="tag ${argClass(t.argument)}">${esc(t.argument)}</span></td>
      <td>${Number(t.risk).toFixed(1)}%</td>
      <td>${Number(t.rr).toFixed(1)}</td>
      <td class="${Number(t.profit) < 0 ? 'neg' : 'pos'}">${money(t.profit)}</td>
      <td><span class="badge ${resultClass(t.result)}">${esc(t.result)}</span></td>
      <td>${esc(t.comment)}</td>
      <td>
        <button class="btn ghost small" onclick="editTrade(${t.id})">✏️</button>
        <button class="btn danger small" onclick="deleteTrade(${t.id})">🗑</button>
      </td>
    </tr>`).join('');
}

function openForm(){
  editId = null;
  document.getElementById('tradeForm').reset();
  document.tradeForm.date.value = new Date().toISOString().slice(0,10);
  document.getElementById('saveBtn').textContent = 'Saqlash';
  document.getElementById('formWrap').classList.add('show');
  document.tradeForm.pair.focus();
}
function closeForm(){
  document.getElementById('formWrap').classList.remove('show');
  editId = null;
}
function editTrade(id){
  const t = trades.find(x => x.id === id);
  if(!t) return;
  editId = id;
  const f = document.tradeForm;
  for(const k of ['date','pair','position','before','after','argument','risk','rr','profit','result','comment']){
    f[k].value = t[k] ?? '';
  }
  document.getElementById('saveBtn').textContent = 'Yangilash';
  document.getElementById('formWrap').classList.add('show');
  window.scrollTo({top:0, behavior:'smooth'});
}
function saveTrade(e){
  e.preventDefault();
  const f = e.target;
  const data = {
    date: f.date.value,
    pair: f.pair.value.trim().toUpperCase(),
    position: f.position.value,
    before: f.before.value.trim(),
    after: f.after.value.trim(),
    argument: f.argument.value,
    risk: parseFloat(f.risk.value) || 0,
    rr: parseFloat(f.rr.value) || 0,
    profit: parseFloat(f.profit.value) || 0,
    result: f.result.value,
    comment: f.comment.value.trim()
  };
  if(editId){
    const i = trades.findIndex(x => x.id === editId);
    if(i > -1) trades[i] = {...trades[i], ...data};
  }else{
    trades.push({id: Date.now(), ...data});
  }
  save();
  closeForm();
  render();
}
function deleteTrade(id){
  if(!confirm("Bu savdoni o'chirasizmi?")) return;
  trades = trades.filter(t => t.id !== id);
  save();
  render();
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(trades, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trading-journal-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error();
      trades = data.map(t => ({...t, id: t.id ?? Date.now() + Math.random()}));
      save();
      render();
    }catch(err){
      alert("Fayl noto'g'ri formatda.");
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

render();
</script>
</body>
</html>
