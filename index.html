<title>AlimovAura Journal – fixed SMC scanner (Copy)</title>
<style>
:root{color-scheme:dark;--bg:#000000;--card:#0A0A0A;--line:#1F1F23;--txt:#E6EBF2;--mut:#ffffff;--input:#111113;--tag:#1A1A1E;--zero:#333333;--g:#16C784;--r:#EA3943;--acc:#3b82f6}
:root[data-theme="light"]{color-scheme:light;--bg:#F8FAFD;--card:#FFFFFF;--line:#E5E7EB;--txt:#0F172A;--mut:#64748B;--input:#FFFFFF;--tag:#EEF2F7;--zero:#CBD5E1;--g:#16C784;--r:#EA3943;--acc:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
h1{font-size:20px;margin:8px 0 2px}
h2{font-size:16px;margin:0}
.sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
select,input,button{background:var(--input);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
button{cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.lang{display:inline-flex;background:var(--input);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:var(--mut);padding:4px 9px;border-radius:999px;font-size:12px;font-weight:600}
.lang button.on{background:var(--acc);color:#fff}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;padding:0}
.kpis{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:6px 0 10px}
.kpis b{color:var(--txt);font-size:15px;display:block}
.periods{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.periods .card{margin:0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.charts .card{margin:0}
.charts b{font-size:13px}
svg{width:100%;height:auto;display:block;overflow:visible}
.audit{border-left:3px solid var(--acc);margin-bottom:12px}
.audit ul{margin:6px 0 0;padding-left:18px}
.audit li{margin:4px 0;font-size:13px}
.warn{color:var(--r)}
.good{color:var(--g)}
.hl{box-shadow:0 0 0 2px var(--acc)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden}
th{color:var(--mut);font-weight:500}
input.c{width:46px;font-size:12px;padding:3px 4px}
input.usd{width:90px;font-size:12px;padding:3px 4px}
input.url{width:100%;min-width:0;font-size:11px;padding:3px 4px}
input.d{width:112px;font-size:11px;padding:3px 4px}
input.pr{width:70px;font-size:12px;padding:3px 4px}
input.st{width:100%;min-width:0;font-size:11px;padding:3px 4px;text-overflow:ellipsis}
input.tf{width:44px;font-size:11px;padding:3px 2px}
input.bal{width:110px}
select[data-f=addemo]{width:54px;font-size:11px;padding:2px}
select.tp,select.sl,select.be{font-size:11px;padding:3px 4px;width:50px;border:0;font-weight:600;color:#fff}
select.tp{background:var(--g);color:#04110b}
select.sl{background:var(--r)}
select.be{background:#4b5563}
button.L,button.S{border:0;border-radius:999px;padding:3px 8px;font-weight:600;font-size:11px}
button.L{background:var(--g);color:#04110b}
button.S{background:var(--r);color:#fff}
.link{color:var(--acc);text-decoration:none;border:1px solid var(--line);padding:4px 8px;border-radius:8px;font-size:12px}
.tag{display:inline-block;background:var(--tag);border-radius:6px;padding:1px 4px;margin:1px;font-size:11px}
.x{cursor:pointer;color:var(--mut);margin-left:3px}
.pos{color:var(--g)}.neg{color:var(--r)}
.done{font-size:11px;color:var(--g);border:1px solid var(--g);border-radius:999px;padding:1px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:380px;width:100%;margin:0}
.hidden{display:none!important}
.cv{background:#22c55e;border:0;border-radius:6px;padding:4px 6px;color:#04110b;font-size:13px;line-height:1;cursor:pointer;transition:filter .15s}
.cv:hover{filter:brightness(1.15)}
.cmp{position:fixed;inset:0;width:100vw;height:100vh;z-index:9999;background:var(--bg);display:flex;flex-direction:column}
.cmp-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.cmp-stat{font-size:12px;color:var(--mut)}
.cmp-stat b{color:var(--txt);font-size:14px;margin-left:4px}
.cmp-close{background:#3a1f24;border:1px solid var(--r);color:#ffb4b9;font-weight:600;border-radius:8px;padding:6px 12px}
.cmp-close:hover{background:var(--r);color:#fff}
.cmp-body{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);min-height:0}
.pane{position:relative;overflow:hidden;min-height:0;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.plabel{position:absolute;top:8px;left:8px;z-index:2;background:var(--input);color:var(--txt);font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.open{position:absolute;top:8px;right:8px;z-index:2;background:var(--input);border:1px solid var(--line);color:var(--acc);padding:4px 8px;border-radius:8px;font-size:12px;text-decoration:none}
.imgwrap{position:absolute;inset:0;overflow:auto;background:#000}
.imgwrap img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.imgwrap.z img{width:200%;height:auto;max-width:none;object-fit:initial;cursor:zoom-out}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);background:var(--card);font-size:14px;padding:16px;text-align:center}
.paneact{position:absolute;bottom:8px;left:8px;z-index:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.paneact button{background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 8px;font-size:12px}
.paneact .hint{font-size:11px;color:var(--mut);background:var(--input);padding:4px 6px;border-radius:8px}
.pane.act .plabel{border-color:var(--acc)}
.cnote{position:absolute;left:8px;right:8px;bottom:44px;z-index:2;font-size:11px;color:var(--mut);background:var(--input);border:1px solid var(--line);padding:4px 6px;border-radius:8px}
@media (max-width:700px){.cmp-body{grid-template-columns:1fr 1fr}.pane{border-right:1px solid var(--line)}}
.err{color:var(--r);font-size:12px;min-height:16px}
.modal .pay{max-width:420px;width:100%;margin:0;text-align:center;padding:24px}
.pay-badge{display:inline-block;background:var(--g);color:#04110b;font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.pay-title{font-size:20px;margin:0 0 8px}
.pay-sub{color:var(--mut);font-size:13px;margin:0 0 18px}
.pay-btn{width:100%;background:var(--g);color:#04110b;border:0;border-radius:12px;padding:18px 14px;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(22,199,132,.35);cursor:pointer}
.pay-btn:hover{filter:brightness(1.08)}
.pay-fine{color:var(--mut);font-size:12px;margin:12px 0 0}
.pay-backup{margin-top:18px;font-size:12px}
.pay-backup a{color:var(--mut);text-decoration:underline;cursor:pointer}
.pay-backup #backupBox{margin-top:10px}
#gate{background:#0D0F12;padding:20px}
html.locked body{background:#0D0F12}
html.locked #app{display:none!important}
html:not(.locked) #gate{display:none!important}
html.locked{overflow:hidden}
.gate-card{max-width:420px;width:100%;background:#161920;border:1px solid #262A34;border-radius:18px;padding:28px 24px;margin:0 auto;text-align:center;color:#fff}
.gate-badge{display:inline-block;border:1px solid #F59E0B;color:#F59E0B;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;margin-bottom:16px;background:transparent}
.gate-title{font-size:28px;font-weight:800;color:#fff;margin:0 0 8px}
.gate-sub{color:#ffffff;font-size:14px;margin:0 0 20px;line-height:1.5}
.gate-feat{background:#1E222B;border-radius:12px;padding:13px 16px;margin:0 0 10px;text-align:left;color:#fff;font-size:14px}
.gate-price{color:#F59E0B;font-weight:800;font-size:20px;margin:18px 0 2px}
.gate-price-sub{color:#ffffff;font-size:13px;margin-bottom:18px}
.gate-btn{width:100%;border:0;border-radius:12px;padding:15px 14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;display:block}
.gate-card-btn{background:#F59E0B;color:#111}
.gate-crypto-btn{background:#16A34A;color:#fff}
.gate-backup{margin-top:14px;font-size:12px}
.gate-backup a{color:#ffffff;text-decoration:underline;cursor:pointer}
.gate-backup #backupBox{margin-top:10px;text-align:left}

:root{--bg:#0D1421;--card:#171924;--line:#222531;--txt:#FFFFFF;--mut:#ffffff;--input:#1E2230;--tag:#1E2230;--zero:#2A2F3D;--acc:#3861FB;--g:#16C784;--r:#EA3943}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums}
.card{border-radius:12px;border:1px solid var(--line);background:var(--card)}
h1{font-size:20px;font-weight:700}
.card>b,h2{font-size:15px;font-weight:600}
table{font-size:13px;font-weight:500}
th{font-size:11px;font-weight:400;color:var(--mut)}
.hero{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(max-width:800px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hk{margin:0;display:flex;flex-direction:column;gap:6px}
.hk span{font-size:11px;color:var(--mut)}
.hk b{font-size:22px;font-weight:700}
.hk.score{flex-direction:row;align-items:center;justify-content:space-between}
.ctab tr{height:52px;cursor:pointer}
.ctab td,.ctab th{border-bottom:1px solid var(--line);vertical-align:middle}
.ctab tbody tr:hover td{background:#1E2230}
.stk{position:sticky;left:0;background:var(--card);z-index:2;width:160px}
.ctab tbody tr:hover td.stk{background:#1E2230}
.av{display:inline-block;width:24px;height:24px;border-radius:50%;background:#2A2F3D;color:#fff;font-size:9px;font-weight:700;text-align:center;line-height:24px;margin-right:8px;vertical-align:middle}
.side{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600}
.side.L{background:rgba(22,199,132,.12);color:#16C784}
.side.S{background:rgba(234,57,67,.12);color:#EA3943}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600}
.pill.tp{background:rgba(22,199,132,.12);color:#16C784}
.pill.sl{background:rgba(234,57,67,.12);color:#EA3943}
.pill.be{background:#2A2F3D;color:#ffffff}
.num{text-align:right}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0 14px}
.wd{font-size:11px;color:var(--mut);text-align:center}
.cal{border:1px solid var(--line);border-radius:8px;padding:6px;min-height:64px;background:var(--card);font-size:12px;display:flex;flex-direction:column;gap:2px}
.cal.win{background:rgba(22,199,132,.15);border-color:#16C784}
.cal.loss{background:rgba(234,57,67,.15);border-color:#EA3943}
.cal .dn{font-size:11px;color:var(--mut)}
.cal small{color:var(--mut);font-size:10px}
.ptabs{display:inline-flex;background:var(--input);border-radius:8px;padding:2px}
.ptabs button{border:0;background:transparent;color:var(--mut);padding:4px 10px;border-radius:6px;font-size:12px}
.ptabs button.on{background:var(--acc);color:#fff}
.tilt{background:rgba(234,57,67,.12);color:#EA3943;border:1px solid #EA3943;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.tip{position:fixed;display:none;background:#222531;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;z-index:10000;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.dr-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000}
.dr-panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--card);border-left:1px solid var(--line);z-index:9001;overflow:auto;padding:14px}
@media(max-width:600px){.dr-panel{top:auto;height:82vh;width:100vw;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}}
.dr-head{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.dr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut)}
.dr-grid label.full{grid-column:1/-1}
.dr-grid input,.dr-grid select{width:100%}
.dr-links{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.dr-links div{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.dr-links input{width:100%}
.dr-emo{margin-top:12px}
.dr-actions{margin-top:16px;display:flex;justify-content:space-between;gap:8px}
.dr-del{background:rgba(234,57,67,.12);color:#EA3943;border:1px solid #EA3943}
.ring text{font-weight:700}
.zoomctl{display:inline-flex;align-items:center;gap:2px;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:2px}
.zbtn{width:26px;height:26px;padding:0;border:0;background:transparent;color:var(--txt);font-size:16px;line-height:1;border-radius:6px}
.zbtn:hover:not(:disabled){background:var(--line)}
.zbtn:disabled{opacity:.35;cursor:default}
#zoomVal{font-size:12px;color:var(--mut);min-width:42px;text-align:center}
.sc{margin-bottom:14px}
.sc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sc-sub{font-size:11px;color:var(--mut);margin-top:2px}
.sc-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.sc-card{min-width:240px;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;flex:0 0 auto}
.sc-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.sc-tag{color:#16C784;font-size:11px;margin:6px 0 8px}
.sc-row{display:flex;justify-content:space-between;color:var(--mut);margin-top:4px;gap:8px}
.sc-row b{color:var(--txt)}
.sc-msg{color:var(--mut);font-size:13px;padding:12px}
.sc-row-h{display:flex;gap:10px;overflow-x:auto;padding:2px 0 14px}
.mini{min-width:150px;flex:0 0 auto;display:flex;flex-direction:column;gap:6px;margin:0;padding:12px 14px;color:var(--txt);text-decoration:none;cursor:pointer}
.mini:hover{border-color:var(--acc)}
.mini b{font-size:13px;font-weight:600}
.mini .mv{font-size:18px;font-weight:700;color:#16C784}
.mini .mp{font-size:12px;color:var(--mut)}
.sc-pill{display:inline-block;color:var(--mut);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin:0 0 14px}
.eq-sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut);margin:6px 0 4px}
.eq-sum b{display:block;color:var(--txt);font-size:16px;font-weight:700}
.gtip{position:fixed;display:none;pointer-events:none;z-index:10001;min-width:180px;padding:10px 12px;border-radius:12px;background:rgba(20,24,33,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 32px rgba(0,0,0,.45);color:#fff;font-size:12px;line-height:1.6;font-variant-numeric:tabular-nums}
.gtip b{font-weight:600}
.gt-h{font-size:13px;font-weight:700;margin-bottom:4px}
svg.eqc{cursor:crosshair}
.gbar{cursor:pointer;transition:opacity .15s}
.gbar:hover{opacity:.82}
.addrow td{padding:0;border-bottom:0}
.ctab tbody tr.addrow:hover td{background:transparent}
.addbtn{width:100%;display:block;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;color:var(--mut);padding:12px 14px;font-size:13px;font-weight:500}
.addbtn:hover{color:var(--txt);background:#1E2230}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 8px;font-size:12px;font-weight:600}
.seg button:hover{color:var(--txt)}
.seg button.on.L,.seg button.on.tp{background:var(--g);border-color:var(--g);color:#04110b}
.seg button.on.S,.seg button.on.sl{background:var(--r);border-color:var(--r);color:#fff}
.seg button.on.be{background:#4b5563;border-color:#4b5563;color:#fff}
.chip{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:4px 10px;font-size:12px;margin:3px 3px 0 0}
.chip.on{background:rgba(56,97,251,.18);border-color:var(--acc);color:var(--txt)}
.dr-emo .lbl,.dr-note label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}
.dr-note{margin-top:12px}
.dr-note textarea{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:12px;resize:vertical}
#hero{display:block;margin-bottom:14px}
.pbanner{position:relative;padding:0;overflow:hidden}
.pbanner svg{display:block}
.pb-head{position:absolute;top:12px;left:16px;right:16px;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:8px;pointer-events:none}
.pb-cap{font-size:12px;color:var(--mut)}
.pb-cap b{color:var(--txt);font-size:16px;font-weight:700}
.pb-badge{font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.pill-s{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--input)}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--input);margin-bottom:12px}
.mbar-l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mbar-m{font-size:14px;font-weight:700;color:var(--txt)}
.mstat{font-size:12px;color:var(--mut)}
.mstat b{color:var(--txt);font-weight:600;margin-left:4px}
.am-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9500}
.am-card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 32px));max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;z-index:9501}
.am-head{display:flex;justify-content:flex-end;margin-bottom:6px}
.am-card .audit{margin-bottom:0}
.pb-legend{position:absolute;top:12px;right:16px;z-index:4;display:flex;gap:6px;pointer-events:auto}

.lg{display:inline-flex;align-items:center;gap:6px;background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:3px 10px;font-size:11px}
.lg i{display:inline-block;width:10px;height:3px;border-radius:2px}
.lg:not(.on){opacity:.45}
.pill-btn{background:#2962FF;border-color:#2962FF;color:#ffffff;border-radius:999px;padding:6px 14px;font-weight:600}
.ptabs button{border-radius:999px}
.ptabs button.on{background:#2962FF}
.calgrid{gap:8px}
.wd{background:#2962FF;color:#ffffff;font-weight:700;border-radius:999px;padding:4px 6px;font-size:10px;line-height:1.4;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctab th,.ctab td{border-right:1px solid rgba(255,255,255,0.1)}
.ctab th:last-child,.ctab td:last-child{border-right:0}
.pm-card{width:min(480px,calc(100vw - 32px))}
.pm-h{font-size:15px;font-weight:600;margin-bottom:10px}
.pm-out{margin-top:12px;font-size:13px;color:var(--mut)}
.pm-out div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.ck{display:flex;gap:8px;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.gate-card{position:relative}
.gate-lang{position:absolute;top:12px;right:12px;display:inline-flex;gap:2px;background:var(--input);border:1px solid var(--line);border-radius:999px;padding:3px}
.gate-lang button{border:0;background:transparent;color:#ffffff;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:600}
.gate-lang button.on{background:#2962FF}
@media (max-width:520px){.gate-card{padding-top:58px}}
.hero-stack{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch;margin-bottom:12px}
.hero-stack>.card{margin:0;display:flex;flex-direction:column;min-width:0}
.hero-stack svg{width:100%;height:260px;display:block}
.hero-stack .pbanner svg{height:260px;margin-top:8px}
.emo-card svg{height:260px}
.emo-card .pill-s{color:#facc15;border-color:rgba(250,204,21,0.55);background:rgba(250,204,21,0.08)}
.emo-strip{margin-top:8px;font-size:12px;color:#ffffff;line-height:1.8}
.emo-strip i{font-style:normal;color:var(--mut);margin:0 6px}
.emo-empty{height:224px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}

.card.pbanner,.card.emo-card{background:#000000;border:1px solid rgba(255,255,255,0.12)}
.pbanner{padding:14px 0 0}
.eq-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 16px}
.eq-bal{font-size:28px;font-weight:800;color:#ffffff;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.eq-pct{font-size:15px;font-weight:700;padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq-pct.up{color:#10b981;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.5);box-shadow:0 0 14px rgba(16,185,129,0.35)}
.eq-pct.down{color:#ef4444;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.5)}
.emo-card{padding:12px}
.emo-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.emo-h b{font-size:13px}
.period-bar{padding:10px 12px}
.ctab{table-layout:fixed;width:100%;border-collapse:collapse}
.ctab tr{height:46px;cursor:pointer}
.ctab th,.ctab td{padding:0 10px;border-bottom:1px solid rgba(255,255,255,0.08);border-right:1px solid rgba(255,255,255,0.08);vertical-align:middle;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.ctab th:last-child,.ctab td:last-child{border-right:0}
.ctab th{height:36px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);background:transparent}
.ctab td{font-size:13px;font-weight:500;color:var(--txt)}
.ctab .al{text-align:left}
.ctab .ac{text-align:center}
.ctab .ar,.ctab .num{text-align:right}

/* ===== Safe storage: if the browser blocks localStorage, use memory so the page still renders ===== */
const store = (() => {
  try { const k = '__bcpj_test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; }
  catch (e) { const mem = {}; return { getItem: k => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; } }; }
})();

/* ===== IndexedDB data layer (trades, emotions, months, balance, avatar + compressed screenshots) =====
   Small UI prefs (language, theme, zoom, access key) stay in localStorage. If IndexedDB is unavailable the
   layer falls back to localStorage so the journal still works. */
const DBX = (() => {
  const NAME = 'bcpj_journal';
  let db = null, mode = 'ls';
  const LSMAP = {trades: 'bcpj_trades_v1', emotions: 'bcpj_emotions_v1', months: 'bcpj_months_v1', balance: 'bcpj_balance', avatar: 'bcpj_avatar'};
  const idbOpen = () => new Promise(res => {
    if (!window.indexedDB) return res(false);
    let rq; try { rq = indexedDB.open(NAME, 1); } catch (e) { return res(false); }
    rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('img')) d.createObjectStore('img'); };
    rq.onsuccess = () => { db = rq.result; db.onversionchange = () => { try { db.close(); } catch (e) {} }; res(true); };
    rq.onerror = rq.onblocked = () => res(false);
  });
  const idbRun = (st, m, fn) => new Promise((res, rej) => {
    let t, out; try { t = db.transaction(st, m); out = fn(t); } catch (e) { return rej(e); }
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
    t.onerror = t.onabort = () => rej(t.error || new Error('idb'));
  });
  const blobToBuf = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(b); });
  const lsGet = k => { try { const v = localStorage.getItem(LSMAP[k]); if (v === null) return undefined; return k === 'avatar' ? v : JSON.parse(v); } catch (e) { return undefined; } };
  const lsSet = (k, v) => localStorage.setItem(LSMAP[k], k === 'avatar' ? String(v) : JSON.stringify(v));
  return {
    get mode() { return mode; },
    async open() { mode = (await idbOpen()) ? 'idb' : 'ls'; return mode; },
    async getKV(k) { return mode === 'idb' ? idbRun('kv', 'readonly', t => t.objectStore('kv').get(k)) : (k === 'migrated' ? true : lsGet(k)); },
    async setKVs(pairs) {      // one atomic transaction
      if (mode === 'idb') return idbRun('kv', 'readwrite', t => { pairs.forEach(([k, v]) => t.objectStore('kv').put(v, k)); });
      pairs.forEach(([k, v]) => { if (LSMAP[k]) lsSet(k, v); });
    },
    async putImg(key, blob) {
      if (mode === 'idb') { const buf = await blobToBuf(blob), rec = {t: blob.type || 'image/jpeg', b: buf}; return idbRun('img', 'readwrite', t => { t.objectStore('img').put(rec, key); }); }
      localStorage.setItem('bcpj_img_' + key, await blobToDataURL(blob));
    },
    async getImg(key) {
      if (mode === 'idb') { const r = await idbRun('img', 'readonly', t => t.objectStore('img').get(key)); return r ? new Blob([r.b], {type: r.t}) : null; }
      const v = localStorage.getItem('bcpj_img_' + key); return v ? dataURLToBlob(v) : null;
    },
    async delImg(key) {
      if (mode === 'idb') return idbRun('img', 'readwrite', t => { t.objectStore('img').delete(key); });
      localStorage.removeItem('bcpj_img_' + key);
    },
    async hasImg(key) { if (mode === 'idb') { const n = await idbRun('img', 'readonly', t => t.objectStore('img').count(key)); return n > 0; } return localStorage.getItem('bcpj_img_' + key) !== null; }
  };
})();
function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }
function dataURLToBlob(u) {
  const i = u.indexOf(','), head = u.slice(5, i), bin = atob(u.slice(i + 1)), a = new Uint8Array(bin.length);
  for (let n = 0; n < bin.length; n++) a[n] = bin.charCodeAt(n);
  return new Blob([a], {type: head.split(';')[0] || 'image/jpeg'});
}

/* ===== Image compression: max 1400px, WebP (JPEG fallback), shrunk until it is about 300 KB ===== */
async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) {} }
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); };
    im.src = u;
  });
}
const canvasBlob = (c, type, q) => new Promise(r => c.toBlob(b => r(b), type, q));
async function compressImage(file, max = 1400, target = 300 * 1024) {
  const im = await loadBitmap(file), w0 = im.width || im.naturalWidth, h0 = im.height || im.naturalHeight;
  if (!w0 || !h0) throw new Error('image');
  let scale = Math.min(1, max / Math.max(w0, h0)), best = null;
  for (let pass = 0; pass < 4; pass++) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w0 * scale)); c.height = Math.max(1, Math.round(h0 * scale));
    const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    for (const q of [0.82, 0.7, 0.58]) {
      let b = await canvasBlob(c, 'image/webp', q);
      if (!b || b.type !== 'image/webp') b = await canvasBlob(c, 'image/jpeg', q);
      if (!b) continue;
      if (!best || b.size < best.size) best = b;
      if (b.size <= target) { if (im.close) im.close(); return b; }
    }
    scale *= 0.85;
  }
  if (im.close) im.close();
  if (!best) throw new Error('image');
  return best;
}

/* ===== Monthly AI audit (rule-based, this month only, USD) ===== */
function audit(f) {
  const box = (L, tilt) => `<div class="card audit">${tilt ? `<div class="tilt">${esc(T('tilt'))}</div>` : ''}<b>${esc(T('auditTitle'))}</b><ul>${L.map(([c, s]) => `<li class="${c}">${s}</li>`).join('')}</ul></div>`;
  if (!f.length) return box([['', esc(T('noData'))]], false);
  const L = [];
  const losses = f.filter(t => t.outcome === 'sl');
  if (!losses.length) L.push(['good', esc(T('noLoss'))]);

  const em = {};
  losses.forEach(t => (t.emotions.length ? t.emotions : ['—']).forEach(e => {
    const o = em[e] || (em[e] = {n: 0, p: 0}); o.n++; o.p = r2(o.p + pnl(t));
  }));
  Object.entries(em).sort((a, b) => a[1].p - b[1].p).slice(0, 2)
    .forEach(([e, o]) => L.push(['warn', esc(T('emoLoss')(EMO(e), o.n, fmt(o.p)))]));

  // Win rate per pair: TP / (TP + SL), combining all timeframes of that pair
  const pr = {};
  f.forEach(t => {
    const o = pr[t.pair] || (pr[t.pair] = {w: 0, l: 0, tfs: {}});
    if (t.outcome === 'tp') o.w++;
    if (t.outcome === 'sl') { o.l++; o.tfs[t.tf] = (o.tfs[t.tf] || 0) + 1; }
  });
  const worst = Object.entries(pr).filter(([, o]) => o.l > 0)
    .map(([p, o]) => ({pair: p, wr: o.w / (o.w + o.l) * 100, l: o.l,
      tf: (Object.entries(o.tfs).sort((a, b) => b[1] - a[1])[0] || ['—'])[0] || '—'}))
    .sort((a, b) => a.wr - b.wr || b.l - a.l)[0];
  if (worst) L.push(['warn', esc(T('worst')(pairRaw(worst.pair), worst.tf, worst.wr.toFixed(0)))]);

  const avg = f.reduce((a, t) => a + t.risk, 0) / f.length;
  const hi = f.filter(t => t.risk > avg).length;
  if (hi) L.push(['warn', esc(T('riskHi')(hi, avg.toFixed(2)))]);
  const days = {};
  f.forEach(t => { const d = days[t.date] || (days[t.date] = {r: 0, m: 0}); d.r = t.outcome === 'sl' ? d.r + 1 : 0; d.m = Math.max(d.m, d.r); });
  Object.entries(days).filter(([, d]) => d.m >= 2)
    .forEach(([d, v]) => L.push(['warn', esc(T('revenge')(d, v.m))]));

  const combo = {};
  f.forEach(t => t.emotions.forEach(e => t.strategy.forEach(s => {
    const k = e + '\u0001' + s; combo[k] = r2((combo[k] || 0) + pnl(t));
  })));
  const bc = Object.entries(combo).sort((a, b) => b[1] - a[1])[0];
  if (bc && bc[1] > 0) { const [e, s] = bc[0].split('\u0001'); L.push(['good', esc(T('best')(EMO(e), s, fmt(bc[1])))]); }
  const bp = {};
  f.forEach(t => bp[t.pair] = r2((bp[t.pair] || 0) + pnl(t)));
  const bpE = Object.entries(bp).sort((a, b) => b[1] - a[1])[0];
  if (bpE) L.push([bpE[1] >= 0 ? 'good' : 'warn', esc(T('bestPair')(pairRaw(bpE[0]), fmt(bpE[1])))]);

  // Tilt: 2+ consecutive stop-losses, or any FOMO / Greed trade
  let run = 0, maxRun = 0;
  [...f].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id).forEach(t => { run = t.outcome === 'sl' ? run + 1 : 0; maxRun = Math.max(maxRun, run); });
  const emoHit = f.filter(t => t.emotions.some(e => /FOMO|Greedy/.test(e))).length;
  return box(L, maxRun >= 2 || emoHit > 0);
}

/* ===== CHART column: 24h price action per trade asset (1H candles, 24 points).
   Live source: OKX V5 spot. Cached 5 min, refreshed with the scanner timer.
   When no exchange answers (sandbox / offline), a 36-point demo series is drawn with the same styling. ===== */
const SPARK_W = 120, SPARK_H = 36, SPARK_PAD = 3, SPARK_TTL = 5 * 60 * 1000, SPARK_RETRY = 60 * 1000;
const SPARK_UP = '#16c784', SPARK_DN = '#ea3943';
const SPARK_CACHE = new Map();    // symbol -> {data, fresh}
const SPARK_INFLIGHT = new Map(); // symbol -> Promise
// Trade pair -> exchange symbol: "BTC/USDT" -> BTCUSDT, "BTC" -> BTCUSDT, Gold / XAU -> PAXGUSDT
function sparkSymbol(pair) {
  let s = String(pair || '').replace(/[\s\/\-]/g, '').toUpperCase();
  if (/^(GOLD|XAU|XAUUSD?T?|XAUT|PAXG)$/.test(s)) return 'PAXGUSDT';
  if (/(USDC|USD)$/.test(s)) return s.replace(/(USDC|USD)$/, 'USDT');
  return /USDT$/.test(s) ? s : s + 'USDT';
}
// Reduces candles (oldest first, {o, c}) to what the chart needs: 24h open, closes, last price, % change
function sparkPack(rows) {
  const open = rows[0].o, last = rows[rows.length - 1].c;
  return {open, closes: rows.map(r => r.c), last, pct: open > 0 ? (last - open) / open * 100 : 0};
}
async function sparkOkx(sym) {
  const instId = sym.replace(/USDT$/, '-USDT');
  for (const host of ROBOT_SOURCES.okx.hosts) {
    try {
      const j = await rbFetchJSON(host + '/api/v5/market/candles?instId=' + instId + '&bar=1H&limit=24', 8000);
      if (j.code !== '0' || !Array.isArray(j.data)) continue;
      const rows = j.data.map(k => ({o: +k[1], c: +k[4]})).reverse();          // OKX also returns newest first
      if (rows.length >= 2) return sparkPack(rows);
    } catch (e) {}
  }
  return null;
}
async function sparkLoad(sym) {
  return sparkOkx(sym);
}
// Cached per symbol for 5 min. A failed fetch keeps the last good data and retries after 60 s.
function fetchSparkData(sym, force) {
  const c = SPARK_CACHE.get(sym);
  if (!force && c && c.fresh > Date.now()) return Promise.resolve(c.data);
  if (SPARK_INFLIGHT.has(sym)) return SPARK_INFLIGHT.get(sym);
  const p = sparkLoad(sym).then(data => {
    const keep = data || (c && c.data) || null;
    SPARK_CACHE.set(sym, {data: keep, fresh: Date.now() + (data ? SPARK_TTL : SPARK_RETRY)});
    return keep;
  }).finally(() => SPARK_INFLIGHT.delete(sym));
  SPARK_INFLIGHT.set(sym, p);
  return p;
}
function sparkSafeId(id) { return String(id ?? '0').replace(/[^a-zA-Z0-9_-]/g, '') || '0'; }
// Line + gradient + dotted baseline at the 24h open. Tooltip: "BTCUSDT • 24s: +3.42%"
function sparkLiveSVG(d, sym, id, fillOp) {
  const n = d.closes.length, W = SPARK_W, H = SPARK_H, P = SPARK_PAD;
  const mx = Math.max(...d.closes, d.open), mn = Math.min(...d.closes, d.open), span = (mx - mn) || 1;
  const X = i => P + i * (W - 2 * P) / Math.max(1, n - 1);
  const Y = v => P + (mx - v) / span * (H - 2 * P);
  const up = d.pct >= 0, col = up ? SPARK_UP : SPARK_DN, op = fillOp || 0.22;
  const pts = d.closes.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1));
  const area = X(0).toFixed(1) + ',' + H + ' ' + pts.join(' ') + ' ' + X(n - 1).toFixed(1) + ',' + H;
  const gid = 'spk-' + sparkSafeId(id) + '-' + (up ? 'u' : 'd');
  const by = Y(d.open).toFixed(1);
  const tip = esc(sym + ' • 24s: ' + (up ? '+' : '') + d.pct.toFixed(2) + '%');
  return `<svg class="spark-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity="${op}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="0" y1="${by}" x2="${W}" y2="${by}" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="2 2"/>
    <polygon points="${area}" fill="url(#${gid})"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"><title>${tip}</title></rect>
  </svg>`;
}
// Demo 24h change per asset (sandbox only). Other symbols get a fixed sign and size from their name.
const SPARK_DEMO_PCT = {BTCUSDT: 3.42, SOLUSDT: 5.18, ETHUSDT: -1.85, PAXGUSDT: 0.64, BNBUSDT: 1.27, XRPUSDT: -2.36};
// 36 points: sharp bullish impulses and bearish pullbacks, then tilted so the last close matches the stated 24h %.
function sparkDemoData(sym) {
  let seed = 0; for (const c of String(sym)) seed = (seed * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const N = 36;
  const target = Math.round((SPARK_DEMO_PCT[sym] ?? (rnd() < 0.5 ? -1 : 1) * (1 + rnd() * 4)) * 100) / 100;
  const sign = target >= 0 ? 1 : -1, amp = Math.max(0.8, Math.abs(target) * 0.6);
  const drift = target / (N - 1), raw = [0];
  let pull = 0;
  for (let i = 1; i < N; i++) {
    let step = drift + (rnd() - 0.5) * amp * 0.8 + pull;
    pull = 0;
    if (rnd() < 0.2) { step += sign * amp * 1.4; pull = -sign * amp * 0.5; }   // impulse, then pullback next bar
    raw.push(raw[i - 1] + step);
  }
  const end = raw[N - 1];
  const closes = raw.map((v, i) => 100 * (1 + (v + (target - end) * i / (N - 1)) / 100));
  closes[0] = 100;
  closes[N - 1] = 100 * (1 + target / 100);
  return {open: 100, closes, last: closes[N - 1], pct: target, src: 'demo'};
}
function sparkDemoSVG(sym, id) { return sparkLiveSVG(sparkDemoData(sym), sym, id, 0.25); }

function traderScore(all, wr, avgRR) {
  if (!all.length) return 0;
  const disc = Math.min(avgRR / 2, 1) * 100;
  const bad = all.filter(t => t.emotions.some(e => /FOMO|Greedy/.test(e))).length;
  const emo = (1 - bad / all.length) * 100;
  return Math.max(0, Math.min(100, Math.round(0.5 * wr + 0.25 * disc + 0.25 * emo)));
}
/* ===== Unified area chart for both hero charts (equity in USD, emotion discipline %):
   emerald 2px line, vertical gradient fill, left Y-axis with gridlines, baseline, date axis, glass hover tooltip ===== */
const CHART_LINE = '#10b981';
function chartArea(vals, o) {
  const W = o.W, H = o.H, PL = 56, PR = 10, TOP = 14, BOT = 26;
  const x0 = PL, x1 = W - PR, y0 = TOP, y1 = H - BOT;
  const n = vals.length, uid = 'ca' + (++chartUid);
  const COL = o.color || CHART_LINE, SW = o.stroke || 2;
  const GLOW = o.glow ? `filter:drop-shadow(0 0 5px ${COL})` : '';
  const span = (o.yHi - o.yLo) || 1;
  const X = i => (n <= 1 ? (x0 + x1) / 2 : x0 + i * (x1 - x0) / (n - 1));
  const Y = v => y0 + (o.yHi - v) / span * (y1 - y0);
  const P = vals.map((v, i) => [X(i), Y(v)]);
  const line = n >= 2 ? monoPath(P) : `M${x0},${P[0][1].toFixed(1)} L${x1},${P[0][1].toFixed(1)}`;
  const area = `${line} L${X(n - 1).toFixed(1)},${y1} L${x0},${y1} Z`;
  const hasRef = o.ref !== undefined;
  const refY = hasRef ? Math.min(y1, Math.max(y0, Y(o.ref))) : y1;
  const grid = o.ticks.map(t => {
    const y = Y(t).toFixed(1);
    return `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>` +
      `<text x="${x0 - 8}" y="${(+y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#94a3b8" style="font-variant-numeric:tabular-nums">${esc(o.fmtY(t))}</text>`;
  }).join('');
  const dateLbls = (o.dates || []).map(d => {
    const x = X(d.i), anc = x <= x0 + 20 ? 'start' : x >= x1 - 20 ? 'end' : 'middle';
    return `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${anc}" font-size="10" fill="#cbd5e1" style="font-variant-numeric:tabular-nums">${esc(d.text)}</text>`;
  }).join('');
  // Above baseline: green fill. Below baseline (drawdown): subtle red fill.
  const fills = hasRef
    ? `<path d="${area}" fill="url(#g${uid})" clip-path="url(#u${uid})"/><path d="${area}" fill="url(#r${uid})" clip-path="url(#d${uid})"/>`
    : `<path d="${area}" fill="url(#g${uid})"/>`;
  const refDefs = hasRef ? `<linearGradient id="r${uid}" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${refY.toFixed(1)}" y2="${y1}"><stop offset="0" stop-color="#ef4444" stop-opacity="0"/><stop offset="1" stop-color="#ef4444" stop-opacity="0.3"/></linearGradient>
    <clipPath id="u${uid}"><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${(refY - y0).toFixed(1)}"/></clipPath>
    <clipPath id="d${uid}"><rect x="${x0}" y="${refY.toFixed(1)}" width="${x1 - x0}" height="${(y1 - refY).toFixed(1)}"/></clipPath>` : '';
  SERIES[uid] = {W, xs: P.map(p => p[0]), ys: P.map(p => p[1]), tips: o.tips};
  return `<svg class="eqc" data-sid="${uid}" viewBox="0 0 ${W} ${H}">
    <defs>
      <linearGradient id="g${uid}" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${y0}" y2="${y1}"><stop offset="0" stop-color="${COL}" stop-opacity="0.35"/><stop offset="1" stop-color="${COL}" stop-opacity="0"/></linearGradient>
      ${refDefs}
    </defs>
    ${grid}
    ${fills}
    ${hasRef ? `<line x1="${x0}" x2="${x1}" y1="${refY.toFixed(1)}" y2="${refY.toFixed(1)}" stroke="rgba(255,255,255,0.3)" stroke-dasharray="4 4" stroke-width="1"/>` : ''}
    <line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <path d="${line}" fill="none" stroke="${COL}" stroke-width="${SW}" stroke-linecap="round" stroke-linejoin="round" style="${GLOW}"/>
    ${dateLbls}
    <line class="xh" x1="0" x2="0" y1="${y0}" y2="${y1}" style="display:none;stroke:rgba(255,255,255,0.22);stroke-dasharray:3 3"/>
    <line class="yh" x1="${x0}" x2="${x1}" y1="0" y2="0" style="display:none;stroke:rgba(255,255,255,0.22);stroke-dasharray:3 3"/>
    <circle class="hd" r="5" fill="${COL}" stroke="#ffffff" stroke-width="1.5" style="display:none;filter:drop-shadow(0 0 6px ${COL})"/>
    <rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="transparent"/>
  </svg>`;
}
function emoStripHTML(sorted) {
  const cnt = new Map();

    cnt.get(e).n++;

  const items = [...cnt.entries()].sort((x, y) => y[1].n - x[1].n || x[1].first - y[1].first);

  return `<div class="emo-strip">${items.map(([e, o]) => `<span>${esc(EMO(e))} (${o.n})</span>`).join('<i>•</i>')}</div>`;
}

    fmtY: v => '$' + v.toLocaleString('en-US', {maximumFractionDigits: 0}), ref: cap, dates, tips: eqTips});

function calHTML(m, f) {

  const first = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const by = {};

  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {

    cells += `<div class="${cls}"><span class="dn">${d}</span>${o ? `<b class="${o.p >= 0 ? 'pos' : 'neg'}">${esc(fmt(o.p))}</b><small>${o.n} ${esc(T('cTrades').toLowerCase())}</small>` : ''}</div>`;

  return `<div class="calgrid">${T('weekdays').map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>`;

function block(m) {
  const f = sortTrades(trades.filter(t => t.date.slice(0, 7) === m));

  const net = r2(f.reduce((a, t) => a + pnl(t), 0));
  const avgR = n ? f.reduce((a, t) => a + pnl(t) / (BALANCE * (t.risk || 1) / 100 || 1), 0) / n : 0;

function brandAvatarHTML() {
  const src = avatarData || DEFAULT_AVATAR;
  const inner = src ? `<img class="brand-img" src="${src}" alt="">` : '<span class="brand-ph">A</span>';
  return `<label class="brand-av-btn" title="Upload photo">${inner}<input class="avatar-file" type="file" accept="image/*" hidden></label>`;
}
document.addEventListener('change', async e => {
  if (!e.target.classList || !e.target.classList.contains('avatar-file')) return;
  const f = e.target.files && e.target.files[0];
  if (!f || !f.type.startsWith('image/')) return;
  try {
    avatarData = await blobToDataURL(await compressImage(f, 256, 40 * 1024));
    await DBX.setKVs([['avatar', avatarData]]);
    document.querySelectorAll('[data-av]').forEach(el => el.innerHTML = brandAvatarHTML());
  } catch (err) { alert('Could not read image'); }
});
function applyStatic() {
  document.documentElement.lang = lang;
  document.title = T('title');
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
  document.querySelectorAll('[data-av]').forEach(el => el.innerHTML = brandAvatarHTML());
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = T(el.dataset.ph));
  document.querySelectorAll('[data-tt]').forEach(el => el.title = T(el.dataset.tt));
  document.querySelectorAll('.gate-lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
}
function setLang(l) {
  if (!I18N[l]) return;
  lang = l; store.setItem('bcpj_lang', l);
  applyStatic(); render();
}

function applyTheme() { document.documentElement.dataset.theme = theme; $('#theme').innerHTML = theme === 'dark' ? MOON : SUN; }
function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; store.setItem('bcpj_theme', theme); applyTheme(); }

/* ===== Split-screen chart comparison (view only; does not change data) ===== */
// TradingView snapshot (tradingview.com/x/ID/) -> direct PNG; direct image URLs pass through; anything else is an iframe
function snapImage(url) {
  const m = url.match(/tradingview\.com\/x\/([A-Za-z0-9]+)/i);
  if (m) return `https://s3.tradingview.com/${m[1][0].toLowerCase()}/${m[1]}.png`;
  return /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(url) ? url : null;
}
// Each panel: uploaded/pasted image (stored locally) > TradingView snapshot PNG > TradingView chart widget for the pair
// Preview for regular chart links: webpage screenshot service (external, so it can be blocked in some sandboxes)
const PREVIEW_BASE = 'https://image.thum.io/get/width/1200/crop/800/';
function previewUrl(url) { return snapImage(url) || (PREVIEW_BASE + encodeURIComponent(url)); }
const TV_INTERVAL = {'15m':'15','1H':'60','4H':'240','1D':'D'};
function widgetView(t) {
  const src = 'https://s.tradingview.com/widgetembed/?symbol=' + encodeURIComponent('OKX:' + t.pair) +
    '&interval=' + (TV_INTERVAL[t.tf] || '60') + '&theme=dark&style=1&locale=en';
  return `<iframe class="frame" src="${esc(src)}" referrerpolicy="no-referrer-when-downgrade" title="TradingView ${esc(t.pair)}"></iframe>`;
}
function imgView(src) { return `<div class="imgwrap"><img src="${esc(src)}" alt=""></div>`; }
function paneHTML(side, label, t, url) {
  const img = t[side + 'Img'] ? imgURL.get(imgKey(t.id, side)) : null;
  const open = url ? `<a class="open" href="${safeUrl(url)}" target="_blank" rel="noopener">${esc(T('openTv'))}</a>` : '';
  const acts = `<div class="paneact"><button data-cmp="upload" data-side="${side}">${esc(T('upload'))}</button>${img ? `<button data-cmp="clear" data-side="${side}">${esc(T('removeImg'))}</button>` : ''}<span class="hint">${esc(T('clickPanel'))}</span></div>`;
  let view;
  if (img) view = imgView(img);
  else if (!url) view = `<div class="ph">${esc(T('noTv'))}</div>`;
  else if (snapImage(url)) view = `<div class="imgwrap"><img class="snap" src="${esc(snapImage(url))}" alt=""></div>`;
  else view = `<div class="imgwrap"><img class="snap" src="${esc(previewUrl(url))}" alt=""></div>`;
  return `<div class="pane" data-side="${side}"><div class="plabel">${esc(label)}</div>${open}${view}${acts}</div>`;
}
async function openCompare(id) {
  const t = trades.find(x => x.id === id); if (!t) return;
  const p = pnl(t);
  cmpId = id; setTarget(null);
  await loadImgs(t);
  if (cmpId !== id) return;
  $('#cmpPair').textContent = t.pair;
  $('#cmpSide').innerHTML = `<button class="${t.side}" style="cursor:default">${t.side === 'L' ? esc(T('long')) : esc(T('short'))}</button>`;
  $('#cmpRisk').textContent = t.risk + '%';
  $('#cmpRR').textContent = '1:' + t.rr;
  $('#cmpPnl').innerHTML = `<span class="${p >= 0 ? 'pos' : 'neg'}">${fmt(p)}</span>`;
  $('#cmpBody').innerHTML = paneHTML('before', T('lblBefore'), t, t.beforeChart) + paneHTML('after', T('lblAfter'), t, t.afterChart);
  $('#cmpBody').querySelectorAll('img.snap').forEach(im => im.onerror = () => { im.parentElement.outerHTML = widgetView(t) + '<div class="cnote">' + T('extNote') + '</div>'; });
  $('#cmpBody').querySelectorAll('.imgwrap').forEach(w => w.onclick = () => w.classList.toggle('z'));
  $('#cmp').classList.remove('hidden');
}
function closeCompare() { $('#cmp').classList.add('hidden'); $('#cmpBody').innerHTML = ''; }
let cmpId = null, activeSide = null;
function setTarget(side) {
  activeSide = side;
  $('#cmpTarget').textContent = side ? T('pasteTarget') + side.toUpperCase() : T('clickPanel');
  document.querySelectorAll('#cmp .pane').forEach(p => p.classList.toggle('act', p.dataset.side === side));
}
async function setImg(side, blob) {
  const t = trades.find(x => x.id === cmpId); if (!t) return;
  const f = side + 'Img', k = imgKey(t.id, side), prev = t[f];
  try {
    if (blob) { await DBX.putImg(k, blob); t[f] = 1; }
    else { t[f] = 0; await DBX.delImg(k); }
    await saveNow();
  } catch (err) { t[f] = prev; alert(T('alertStorage')); return; }
  dropImgURL(k);
  if (blob) imgURL.set(k, URL.createObjectURL(blob));
  await openCompare(cmpId); setTarget(side);
}
$('#cmp').addEventListener('click', e => {
  const b = e.target.closest('[data-cmp]');
  if (b) {
    setTarget(b.dataset.side);
    if (b.dataset.cmp === 'upload') $('#cmpFile').click();
    if (b.dataset.cmp === 'clear') setImg(b.dataset.side, null);
    return;
  }
  const p = e.target.closest('.pane[data-side]');
  if (p && !e.target.closest('a,iframe')) setTarget(p.dataset.side);
});
$('#cmpFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !activeSide) return;
  try { await setImg(activeSide, await compressImage(f)); } catch (err) { alert(T('alertRead')); }
};
document.addEventListener('paste', async e => {
  if ($('#cmp').classList.contains('hidden') || !activeSide) return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  try { await setImg(activeSide, await compressImage(item.getAsFile())); } catch (err) { alert(T('alertRead')); }
});
$('#cmpClose').onclick = closeCompare;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#cmp').classList.contains('hidden')) closeCompare(); });

/* ===== Events ===== */
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.f;
  if (!f) return;
  const t = trades.find(x => x.id === +el.dataset.id);
  if (!t) return;
  if (f === 'addemo') {
    let v = el.value;
    if (v === '__new') { v = (prompt(T('newEmo')) || '').trim(); if (v && !emotions.includes(v)) emotions.push(v); }
    if (v && !t.emotions.includes(v)) t.emotions.push(v);
  }
  else if (f === 'strategy') t.strategy = el.value.split(',').map(s => s.trim()).filter(Boolean);
  else if (f === 'risk') t.risk = Math.max(0, +el.value || 0);
  else if (f === 'rr') t.rr = Math.max(0, +el.value || 0);
  else if (f === 'override') {
    const v = parseUSD(el.value);
    if (el.value.trim() !== '' && v === null) { alert(T('alertAmount')); render(); return; }
    t.override = v; editing.delete(t.id + '|override');
  }
  else if (f === 'beforeChart' || f === 'afterChart') {
    const v = el.value.trim();
    if (v && !/^https?:\/\//i.test(v)) { alert(T('badLink')); render(); return; }
    t[f] = v; editing.delete(t.id + '|' + f);
  }
  else t[f] = el.value;
  save(); render();
});

$('#bal').onchange = e => {
  const v = +e.target.value;
  if (v > 0) { BALANCE = r2(v); save(); render(); }
  else e.target.value = BALANCE;
};

document.addEventListener('click', e => {
  if (e.target.closest('#theme')) { toggleTheme(); return; }
  const lb = e.target.closest('#lang button, .gate-lang button'); if (lb) { setLang(lb.dataset.l); return; }
  if (e.target.closest('#newmonth')) { startMonth(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'drawer') { if (e.target.closest('input,select,textarea,button')) return; drawerId = +a.dataset.id; render(); return; }
  if (act === 'drawerclose') { drawerId = null; render(); return; }
  if (act === 'ptab') { periodMode = a.dataset.m; render(); return; }
  if (act === 'compare') { openCompare(+a.dataset.id); return; }
  if (act === 'edit') { editing.add(a.dataset.key); render(); return; }
  if (act === 'analyze') { auditMonth = a.dataset.m; render(); return; }
  if (act === 'auditclose') { auditMonth = null; render(); return; }
  if (act === 'newtrade') {
    const m = a.dataset.m;
    draft = {date: m === CUR ? TODAY : m + '-01', pair: '', side: null, outcome: null, risk: '', rr: '', pnl: '', tf: '', strategy: '', emotions: [], note: '', beforeChart: '', afterChart: ''};
    drawerId = null; render(); return;
  }
  if (act === 'pro-risk') { proModal = 'risk'; render(); return; }
  if (act === 'pro-check') { proModal = 'check'; render(); return; }
  if (act === 'pm-close') { proModal = null; render(); return; }
  if (act === 'lg') { lineVis[a.dataset.v] = !lineVis[a.dataset.v]; render(); return; }

function swingPoints(c, L) {

function rsi14(c) {

function smcFromPeak(c, H, hi, lo, price, near) {

  for (let j = H.i + 1; j < n; j++) if (c[j].h > H.p) return null;

  const PH = hi.filter(x => x.i < H.i).pop();

  const lows = lo.filter(x => x.i > PH.i && x.i < H.i);

  const L = lows.reduce((a, b) => (b.p < a.p ? b : a));

  const retr = (H.p - price) / range;

  }

  let sweep = false;
  for (let i = H.i + 2; i < n - 1 && !sweep; i++) {

function analyzeSMC(c, livePrice) {

  const tier = r.tier === 'A' ? 'A' : 'B';
  return `<div class="card rb-card">
    <div class="rb-top"><span class="rb-rank">#${i + 1}</span><b>${esc(base)}/USDT</b>${gold ? `<span class="rb-gold">${esc(T('rbGold'))} · XAU</span>` : ''}</div>
    <div class="rb-price">${esc(fmtPrice(r.price))} <span class="${up ? 'pos' : 'neg'} rb-chg">${up ? '+' : ''}${r.chg.toFixed(2)}%</span></div>
    <div class="rb-sig"><span class="rb-tier t${r.near ? 'C' : tier}">${esc(T(r.near ? 'tierC' : 'tier' + tier))}</span><span class="rb-badge">${esc((r.near ? [T('rbApproach')].concat(r.tags) : r.tags).join(' · '))}</span><span class="rb-score">${r.score}%</span></div>
    <div class="rb-kv"><span>${esc(T('scEntry'))}</span><b>${esc(fmtPrice(r.zoneLow))} – ${esc(fmtPrice(r.zoneHigh))}</b></div>
    ${r.near ? '' : `<div class="rb-kv"><span>${esc(T('scSL'))}</span><b class="neg">${esc(fmtPrice(r.sl))}</b></div>
    <div class="rb-kv"><span>${esc(T('scTarget'))}</span><b class="pos">${esc(fmtPrice(r.tp))}</b></div>`}
    <div class="rb-kv"><span>${esc(T('rbFib'))}</span><b>${(r.retr * 100).toFixed(1)}% · Fib ${r.retr.toFixed(3)}</b></div>
    ${r.near ? '' : `<div class="rb-kv"><span>RR</span><b class="rb-rr">1:${r.rr.toFixed(1)}</b></div>`}
    <a class="rb-tv" href="${esc(tvUrl(r.sym))}" data-tv="${esc(r.sym)}" target="_blank" rel="noopener noreferrer">${esc(T('rbTv'))}</a>
  </div>`;
}
// Light update during a scan: only the counter and the bar change, so cards (and their links) are never re-created mid-click
function updateScanProgress() {
  const s = robotState, pr = document.getElementById('rbProg'), bar = document.querySelector('#scanner .rb-bar i');
  if (pr) pr.textContent = s.scanned ? `${T('rbProgress').replace(/:$/, '')} ${s.checked} / ${s.scanned}` : '';
  if (bar) bar.style.width = (s.scanned ? Math.round(s.checked / s.scanned * 100) : 0) + '%';
}
function renderScanner() {
  const el = document.getElementById('scanner'); if (!el) return;
  const s = robotState, busy = s.status === 'loading', off = s.status === 'offline';
  const stamp = s.updated ? s.updated.toLocaleTimeString(LOC[lang], {hour: '2-digit', minute: '2-digit', second: '2-digit'}) : '';
  const n = s.results.length;
  const status = busy ? T('rbScanning') : off ? T('scError') : n ? `${T('rbReady')} ${n}` : T('rbEmpty');
  const nearL = s.near || [];
  let body;
  if (n) body = `<div class="rb-row-h">${s.results.map(rbCardHTML).join('')}</div>`;
  else if (busy && s.status === 'loading' && !nearL.length) body = `<div class="sc-pill">${esc(T('rbScanning'))}</div>`;
  else if (s.status === 'idle') body = `<div class="sc-pill">${esc(T('rbScanning'))}</div>`;
  else if (off && !nearL.length) body = `<div class="sc-pill">${esc(T('scError'))}</div>`;
  else body = `<div class="sc-pill">${esc(T('rbEmpty'))}</div>`;
  if (!n && nearL.length && !off) body += `<div class="rb-foot" style="margin:0 0 8px">${esc(T('rbNearTitle'))}</div><div class="rb-row-h">${nearL.map(rbCardHTML).join('')}</div>`;
  const prev = el.querySelector('.rb-row-h'), sl = prev ? prev.scrollLeft : 0;
  el.innerHTML = `<div class="card rb-wrap">
    <div class="rb-head">
      <div class="rb-title"><span class="rb-pulse${off ? ' off' : busy ? ' busy' : ''}"></span><b>${esc(T('scTitle'))}</b><span class="rb-live">${esc(status)}</span></div>
      <div class="rb-meta"><span class="rb-stat">${esc(T('rbAuto'))}</span>${stamp ? `<span class="rb-stat">${esc(T('rbUpdated'))}: ${esc(stamp)}</span>` : ''}<span class="rb-stat">Manba: OKX</span>${busy ? '<span class="rb-stat rb-prog" id="rbProg"></span>' : ''}<button type="button" id="robotRescan" class="rb-btn"${busy ? ' disabled' : ''}>${esc(T('rbRescan'))}</button></div>
    </div>
    <div class="rb-bar${busy ? ' on' : ''}"><i style="width:0%"></i></div>
    ${body}
    <div class="rb-foot">${esc(T('scDisc'))}</div>
  </div>`;
  const row = el.querySelector('.rb-row-h'); if (row) row.scrollLeft = sl;
  if (busy) updateScanProgress();
}
// Capture phase: runs before any other click handler, so nothing can swallow the link click.
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a.rb-tv[data-tv]');
  if (a) {
    e.preventDefault(); e.stopPropagation();
    window.open(tvUrl(a.dataset.tv), '_blank', 'noopener,noreferrer');
    return;
  }
  if (e.target.closest && e.target.closest('#robotRescan')) runRobot();
}, true);

applyZoom();
applyTheme();
applyStatic();
// First paint of the data waits for IndexedDB (and the one-time localStorage migration)
bootData().catch(e => { console.warn('[journal] bootData', e); trades = trades.length ? trades : SAMPLE(); dbReady = true; })
  .finally(() => { applyStatic(); render(); startRobot(); });

/* ===== Mini App button: native install prompt when available, otherwise a compact instruction card ===== */
let miniDeferred = null;
const miniStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
function miniRefresh() { const w = document.getElementById('miniWrap'); if (w) w.style.display = miniStandalone() ? 'none' : ''; }
function miniRender() {
  document.getElementById('miniPop').innerHTML =
    `<b>${esc(T('miniHead'))}</b>` +
    `<h4>${esc(T('miniDesk'))}</h4><ol>${T('miniDeskSteps').map(x => `<li>${esc(x)}</li>`).join('')}</ol>` +
    `<h4>${esc(T('miniMob'))}</h4><ol>${T('miniMobSteps').map(x => `<li>${esc(x)}</li>`).join('')}</ol>` +
    `<button type="button" class="mini-ok" id="miniOk">${esc(T('miniClose'))}</button>`;
}
function miniToggle(force) {
  const p = document.getElementById('miniPop');
  const on = typeof force === 'boolean' ? force : !p.classList.contains('on');
  if (on) miniRender();
  p.classList.toggle('on', on);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); miniDeferred = e; });
window.addEventListener('appinstalled', () => { miniDeferred = null; miniRefresh(); });
document.getElementById('miniBtn').addEventListener('click', async e => {
  e.stopPropagation();
  if (miniDeferred) {                                  // Chrome / Edge / Android: native install / shortcut popup
    const ev = miniDeferred; miniDeferred = null;
    ev.prompt();
    try { await ev.userChoice; } catch (err) {}
    return;
  }
  miniToggle();                                        // Safari, Firefox, or prompt already used: instruction card
});
document.getElementById('miniPop').addEventListener('click', e => { if (e.target.id === 'miniOk') miniToggle(false); });
document.addEventListener('click', e => { if (!e.target.closest('#miniWrap')) miniToggle(false); });
try { window.matchMedia('(display-mode: standalone)').addEventListener('change', miniRefresh); } catch (e) {}
miniRefresh();
</script>
</body></html>
